name: CI

on:
  push:
    branches: [ main, feature/business-migrations ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r patent_code/requirements.txt
          pip install alembic asyncpg psycopg[binary]

      - name: Wait for Postgres
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do sleep 1; done

      - name: Export DATABASE_URL
        run: echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/petcare" >> $GITHUB_ENV

      - name: Run alembic upgrade
        working-directory: patent_code/backend
        run: |
          alembic -c alembic.ini upgrade head

      - name: Run tests
        run: |
          cd patent_code
          pytest -q
jobs:
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/petcare
      REDIS_URL: redis://redis:6379/0

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r patent_code/requirements.txt
      - name: Wait for Postgres
        run: |
          python - <<'PY'
import os, time, asyncio
import asyncpg
url = os.environ.get('DATABASE_URL')
for i in range(30):
    try:
        conn = asyncio.get_event_loop().run_until_complete(asyncpg.connect(url))
        asyncio.get_event_loop().run_until_complete(conn.close())
        print('Postgres ready')
        break
    except Exception as e:
        print('Waiting for Postgres...', e)
        time.sleep(2)
else:
    raise SystemExit('Postgres did not become ready')
PY
      - name: Apply migrations
        working-directory: patent_code
        run: |
          alembic upgrade head || true
      - name: Run tests
        run: |
          pytest -q patent_code/tests
