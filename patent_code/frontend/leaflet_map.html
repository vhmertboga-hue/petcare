<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Vet Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 100vh; }
    .leaflet-popup-content-wrapper { max-width: 300px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([39.92, 32.85], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    async function loadClinics(lat=null, lon=null) {
      let url = '/api/clinics';
      if (lat && lon) url += `?lat=${lat}&lon=${lon}`;
      const r = await fetch(url, { credentials: 'include' });
      const clinics = await r.json();
      clinics.forEach(c => {
        if (c.latitude && c.longitude) {
          const marker = L.marker([c.latitude, c.longitude]).addTo(map);
          const popup = `<strong>${c.name}</strong><br/>${c.address || ''}<br/>${c.phone || ''}`;
          marker.bindPopup(popup);
        }
      });
    }

    // Try to use browser geolocation to center map and fetch nearby clinics
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        const { latitude, longitude } = pos.coords;
        map.setView([latitude, longitude], 13);
        loadClinics(latitude, longitude);
      }, (err) => {
        loadClinics();
      });
    } else {
      loadClinics();
    }
  </script>
</body>
</html>
